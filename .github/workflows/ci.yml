name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality, Tests & Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadify_ci?sslmode=disable"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/shadify_ci?sslmode=disable"
      ADMIN_SESSION_SECRET: "test-admin-session-secret-min-32-chars-long-for-ci"
      ERASURE_HMAC_SECRET: "test-erasure-hmac-secret-min-32-chars-ci"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run Brand Isolation Audit
        run: npm run lint:brand

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run Vitest Unit & Integration Tests
        run: npm run test

      - name: Build Next.js Production Bundle
        run: npm run build

  db-gate:
    name: Postgres 16 Migrations, Protections & Tenant Isolation (A9 & A10)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadify_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadify_ci?sslmode=disable"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/shadify_ci?sslmode=disable"
      ADMIN_SESSION_SECRET: "test-admin-session-secret-min-32-chars-long-for-ci"
      ERASURE_HMAC_SECRET: "test-erasure-hmac-secret-min-32-chars-ci"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply Migrations from Empty
        run: npm run db:migrate:deploy

      - name: Verify Migration Status (Zero Pending Migrations)
        run: npm run db:migrate:status

      - name: Run Real Postgres Protections, Isolation & Erasure Suite
        run: npm run test:db

  e2e:
    name: Playwright E2E Smoke Tests
    needs: [validate, db-gate]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadify_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadify_ci?sslmode=disable"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/shadify_ci?sslmode=disable"
      ADMIN_SESSION_SECRET: "test-admin-session-secret-min-32-chars-long-for-ci"
      ERASURE_HMAC_SECRET: "test-erasure-hmac-secret-min-32-chars-ci"
      TEST_STAFF_EMAIL: "concierge@shadify.in"
      TEST_STAFF_PASSWORD: "TestStaffPass!2026"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply Migrations
        run: npm run db:migrate:deploy

      - name: Seed Database
        run: npm run db:seed

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
