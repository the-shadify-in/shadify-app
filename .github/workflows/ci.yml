name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality, Tests & Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadify_ci?sslmode=disable"
      ADMIN_SESSION_SECRET: "test-admin-session-secret-min-32-chars-long-for-ci"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run Brand Isolation Audit
        run: npm run lint:brand

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run Vitest Unit & Integration Tests
        run: npm run test

      - name: Build Next.js Production Bundle
        run: npm run build

  e2e:
    name: Playwright E2E Smoke Tests
    needs: validate
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadify_ci?sslmode=disable"
      ADMIN_SESSION_SECRET: "test-admin-session-secret-min-32-chars-long-for-ci"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
