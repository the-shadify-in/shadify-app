name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadify_ci?sslmode=disable"
      ADMIN_SESSION_SECRET: "test-admin-session-secret-min-32-chars-long-for-ci"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Code Formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run type-check

      - name: Run Brand Isolation Audit
        run: npm run lint:brand

      - name: Run WCAG Contrast Matrix Tests
        run: npm run test:contrast

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build Next.js Production Bundle
        run: npm run build

      - name: Security Vulnerability Scan (Non-blocking)
        run: npm audit || true
        continue-on-error: true
